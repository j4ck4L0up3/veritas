  env: "$HOME/.local/share/veritas"
  logs: "$HOME/.local/share/veritas"
  blobs: "$HOME/.local/share/veritas/blobs"
  uploads: "$HOME/.local/share/veritas/uploads"
  service: "$HOME/.config/systemd/user"
